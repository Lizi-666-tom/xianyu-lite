name: XianyuLite
options:
  bundleIdPrefix: com.linguang
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"
    ONLY_ACTIVE_ARCH: "NO"
    ARCHS: "arm64"

targets:
  XianyuLite:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Resources/web
        type: folder
      - path: Resources/Assets.xcassets
        type: file
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linguang.xianyulite
        PRODUCT_NAME: XianyuLite
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        VALIDATE_PRODUCT: "NO"
