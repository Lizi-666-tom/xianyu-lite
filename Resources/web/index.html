<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>小铺数据 · 经营罗盘（离线复现）</title>
  <!-- 空 favicon：避免浏览器自动请求 /favicon.ico 产生 404 -->
  <link rel="icon" href="data:," />

  <!-- 页面样式：原始 operate-compass.css 的本地化版本（字体/图片已全部下到 assets/）
       ?v=N 只用于破缓存，用户刷新即可拿到新文件 -->
  <link rel="stylesheet" href="./assets/operate-compass.css?v=8" />
  <!-- 本地化补丁：字体族名别名 + 图标兜底 + 公告轮播隐藏 + 顶部安全区/留白收紧（不含任何外链） -->
  <link rel="stylesheet" href="./assets/local-overrides.css?v=22" />

  <style>
    html, body { margin: 0; padding: 0; background: #f2f3f5; }
    #root { min-height: 100vh; }

    /* 首屏加载遮罩：1.1MB 的 bundle 在手机上要解析一会儿，
       先盖一层和页面同色的骨架，避免白屏闪烁；渲染出内容后自动淡出 */
    #xy-splash {
      position: fixed; inset: 0; z-index: 99998;
      background: #f2f3f5;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .18s ease;
      pointer-events: none;
    }
    #xy-splash.hide { opacity: 0; }
    /* 官方加载动画：闲鱼 kun 容器用的那张 96×96 GIF（80 帧），
       来自 operate-compass bundle 的 loading--gif 组件，已本地化 */
    #xy-splash .xy-spin-gif {
      width: 48px; height: 48px; display: block;
    }

    /* 调试面板：默认隐藏，地址后加 ?diag=1 才显示 */
    #diag {
      display: none;
      position: fixed; left: 0; bottom: 0; right: 0; z-index: 99999;
      max-height: 38vh; overflow: auto;
      background: rgba(0, 0, 0, .86); color: #7CFC98;
      font: 11px/1.45 Consolas, Menlo, monospace;
      padding: 6px 8px; white-space: pre-wrap; margin: 0;
    }
    body.diag-on #diag { display: block; }
  </style>
</head>

<body>
  
  <script src="./assets/safe-area.js?v=3"></script>
<!-- 首屏遮罩：见上方样式说明 -->
  <div id="xy-splash"><img class="xy-spin-gif" src="./img/O1CN01EnTSix1cJEGq3h5LS__6000000003579-1-tps-96-96.gif" alt="" /></div>

  <!-- 页面挂载点。bundle 的 csrRender 会 document.getElementById('root') 然后 createRoot -->
  <div id="root"></div>
  <pre id="diag"></pre>

  <script>
    /* 遮罩：到点就撤，不等渲染
       —— 官方 bundle 要 300~500ms 才渲染完，如果等渲染，遮罩就会一直被撑住。
          这里改成固定 80~200ms 随机后无条件淡出，只留"闪一下"的观感，
          和闲鱼原生切页一致（原生也是页面先闪一下再出内容）。 */
    (function () {
      var splash = document.getElementById('xy-splash');
      var SHOW = 80 + Math.floor(Math.random() * 121);   // 0.08~0.2 秒随机
      var removed = false;

      function kill() {
        if (removed || !splash) return;
        removed = true;
        splash.classList.add('hide');
        setTimeout(function () {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 160);
      }

      setTimeout(kill, SHOW);          // 到点就撤（主路径）
      setTimeout(kill, 3000);          // 兜底，最多 3 秒
    })();
  </script>

  <!-- ① React / ReactDOM 必须是全局变量：bundle 里是 webpack externals
       5194(t){t.exports=React}  5206(t){t.exports=ReactDOM} -->
  <script src="./assets/react.production.min.js?v=8"></script>
  <script src="./assets/react-dom.production.min.js?v=8"></script>

  <!-- ② mock 数据 + mtop 拦截层（必须在 app 之前）
       daily-data.js 必须排在 data.js 前面：它是两页共用的「按日数据源」 -->
  <script src="./mock/daily-data.js?v=15"></script>
  <script src="./mock/data.js?v=20"></script>
  <script src="./mock/mtop-mock.js?v=9"></script>

  <!-- ③ 环境标记 -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var diagOn = q.get('diag') === '1';
      if (diagOn) document.body.classList.add('diag-on');

      var log = [];
      window.__DIAG__ = log;
      window.__XY_DEBUG__ = diagOn;
      window.__log__ = function (s) {
        log.push(s);
        if (!diagOn) return;
        var el = document.getElementById('diag');
        if (el) el.textContent = log.slice(-120).join('\n');
      };
      window.addEventListener('error', function (e) {
        window.__log__('[error] ' + (e.message || e) + '\n' +
          String((e.error && e.error.stack) || '').split('\n').slice(0, 6).join('\n'));
      });
      window.addEventListener('unhandledrejection', function (e) {
        window.__log__('[reject] ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason));
      });

      window.__pageConfInfo = window.__pageConfInfo || {};
      window.$fetchData = { enable: false };
      // renderMode 故意不设 -> 走 csrRender -> createRoot(#root)
      // kun 故意不设 -> 不挂到 document.body
      window.__isSSR = false;

      window.__log__('[boot] React=' + (window.React && React.version) +
        ' createRoot=' + typeof (window.ReactDOM && ReactDOM.createRoot));
    })();
  </script>

  <!-- ④ 页面主 bundle -->
  <script src="./assets/operate-compass.js?v=12"></script>

  <!-- ④b 两页导航（小铺数据 ⇄ 鱼小铺）：?page=shop 会直接跳到 shop.html，
       左上角返回键位置叠了透明热区（官方返回走原生桥，浏览器里是空操作） -->
  <script>window.MOYU_PAGE = 'compass';</script>
  <script src="./assets/nav.js?v=103"></script>

  <!-- ⑤ 可选：自动切 tab（?tab=概览|商品|粉丝|客服|推广，或英文 Overview/Goods/Fans/CustomerService/Promotion） -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var want = q.get('tab');
      window.__log__('[boot] bundle executed, #root children=' +
        (document.getElementById('root') || {}).children?.length);

      // 画布自检：报告每个 canvas 是否真的画上了东西
      function canvasReport() {
        var cs = document.querySelectorAll('canvas');
        if (!cs.length) return;
        var out = [];
        for (var i = 0; i < cs.length; i++) {
          var c = cs[i];
          var painted = -1;
          try {
            var ctx = c.getContext('2d');
            var w = c.width, h = c.height;
            if (w && h) {
              var d = ctx.getImageData(0, 0, w, h).data;
              var n = 0;
              for (var p = 3; p < d.length; p += 4 * 37) if (d[p] !== 0) n++;
              painted = n;
            }
          } catch (e) { painted = -2; }
          out.push('canvas#' + i + ' ' + c.width + 'x' + c.height + ' paintedSample=' + painted);
        }
        window.__log__('[canvas] ' + out.join(' | '));
      }

      if (want) {
        var ALIAS = {
          overview: '概览', goods: '商品', fans: '粉丝',
          customerservice: '客服', promotion: '推广', marketing: '推广'
        };
        var label = ALIAS[want.toLowerCase()] || want;
        setTimeout(function () {
          var tabs = [].slice.call(document.querySelectorAll('div'))
            .filter(function (d) {
              return d.children.length === 0 &&
                /nav--(?:un)?[Aa]ctiveTab/.test(d.className || '') &&
                d.textContent.trim() === label;
            });
          if (!tabs.length) { window.__log__('[tab] 找不到 tab: ' + label); return; }
          window.__log__('[tab] clicking: ' + label);
          tabs[0].click();
          setTimeout(function () {
            window.__log__('[tab] after click, #root htmlLen=' +
              document.getElementById('root').innerHTML.length);
            canvasReport();
          }, 1800);
        }, 1500);
      } else {
        setTimeout(canvasReport, 2500);
      }
    })();
  </script>

  <!-- ⑥ 文案 / 结构后处理（不改官方 bundle，纯 DOM 层补丁）
       a) 「较前 + 中文数字 + 日/天/周/月/年」里的中文数字 -> 阿拉伯数字
          （注意：只匹配中文数字，mock 层已经按 dateType 动态生成的 较前1日/7日/30日/N日 原样放过）
       b) 顶部数据更新说明旧文案 -> 「今日数据于明日15点前更新」（mock 里已改，这里兜底）
       c) 公告轮播整块移除，并把隐藏后变空的父容器一起收掉，避免留空白 -->
  <script>
    (function () {
      'use strict';

      var TIP_OLD = /数据每\s*5\s*分钟更新一次/g;
      var TIP_NEW = '今日数据于明日15点前更新';
      // 较前 + 中文数字 + 时间单位
      var RE_CN_NUM = /较前([一二两三四五六七八九十]+)(日|天|周|月|年)/g;

      var CN = { '零': 0, '一': 1, '二': 2, '两': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };

      function cn2num(s) {
        if (s.indexOf('十') < 0) {
          return String(CN[s] != null ? CN[s] : s);
        }
        var p = s.split('十');
        var a = p[0] === '' ? 1 : (CN[p[0]] || 0);   // 十 -> 10, 二十 -> 20
        var b = p[1] === '' ? 0 : (CN[p[1]] || 0);   // 十一 -> 11, 三十 -> 30
        return String(a * 10 + b);
      }

      // 只替换命中关键字的字符串，其余原样返回（幂等）
      function fixString(v) {
        if (!v || typeof v !== 'string') return v;
        if (v.indexOf('较前') < 0 && v.indexOf('更新一次') < 0) return v;
        return v
          .replace(RE_CN_NUM, function (m, num, unit) { return '较前' + cn2num(num) + unit; })
          .replace(TIP_OLD, TIP_NEW);
      }

      function fixTextIn(root) {
        if (!root) return;
        if (root.nodeType === 3) {                       // 文本节点
          var nv = fixString(root.nodeValue);
          if (nv !== root.nodeValue) root.nodeValue = nv;
          return;
        }
        if (root.nodeType !== 1) return;                 // 元素节点
        var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
        var n;
        while ((n = w.nextNode())) {
          var v = fixString(n.nodeValue);
          if (v !== n.nodeValue) n.nodeValue = v;
        }
      }

      // 公告轮播：隐藏 banner；若其父容器隐藏后变成空盒，一并隐藏
      function hasVisibleOtherChild(p, skip) {
        for (var i = 0; i < p.children.length; i++) {
          var c = p.children[i];
          if (c === skip) continue;
          if (c.offsetHeight > 0 || (c.textContent || '').trim()) return true;
        }
        return false;
      }

      function hideNotice() {
        var els = document.querySelectorAll('[class*="notic-banner--noticeBanner"]');
        for (var i = 0; i < els.length; i++) {
          var el = els[i];
          el.style.setProperty('display', 'none', 'important');
          var p = el.parentElement;
          if (!p || hasVisibleOtherChild(p, el)) continue;
          p.style.setProperty('display', 'none', 'important');
          var gp = p.parentElement;      // overview--period-box 之类的外层，若也空了就收掉
          if (gp && /overview--period-box/.test(gp.className || '') && !hasVisibleOtherChild(gp, p)) {
            gp.style.setProperty('display', 'none', 'important');
          }
        }
      }

      var scheduled = false;
      function schedule() {
        if (scheduled) return;
        scheduled = true;
        setTimeout(function () { scheduled = false; hideNotice(); }, 60);
      }

      function runAll(root) {
        fixTextIn(root || document.body);
        hideNotice();
      }

      // 首屏
      runAll(document.body);
      [200, 800, 2000, 4000].forEach(function (t) { setTimeout(function () { runAll(document.body); }, t); });

      // tab 切换 / 懒加载 / 轮播重排：只处理新增子树与被改文本，避免整页重扫
      var mo = new MutationObserver(function (muts) {
        for (var i = 0; i < muts.length; i++) {
          var m = muts[i];
          if (m.type === 'characterData') {
            fixTextIn(m.target);
          } else if (m.type === 'childList') {
            for (var j = 0; j < m.addedNodes.length; j++) {
              var a = m.addedNodes[j];
              if (a.nodeType === 1 || a.nodeType === 3) fixTextIn(a);
            }
          }
        }
        schedule();
      });
      mo.observe(document.body, { childList: true, subtree: true, characterData: true });

      // 供验证脚本查询
      window.__MOYU_FIX__ = { fixString: fixString, runAll: runAll, hideNotice: hideNotice };
      window.__log__('[moyu] text/structure post-processor installed');
    })();
  </script>
</body>

</html>
