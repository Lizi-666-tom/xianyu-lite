name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # Xcode 15 不支持 objectVersion 77，用 macos-15（Xcode 16）跑
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          xcodebuild -version
          sw_vers
          ls -la

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate
          echo "--- objectVersion ---"
          grep -m1 objectVersion XianyuLite.xcodeproj/project.pbxproj || true
          echo "--- xcodebuild 版本 ---"
          xcodebuild -version

      - name: Ensure project format compatible
        run: |
          set -e
          OV=$(grep -m1 'objectVersion = ' XianyuLite.xcodeproj/project.pbxproj | tr -dc '0-9' || echo "")
          echo "生成的项目格式: $OV"
          if [ "$OV" = "77" ]; then
            echo "降级到 56（兼容 Xcode 15）"
            sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' XianyuLite.xcodeproj/project.pbxproj
          fi
          echo "--- 最终格式 ---"
          grep -m1 objectVersion XianyuLite.xcodeproj/project.pbxproj || true
          echo "--- 验证可读 ---"
          xcodebuild -project XianyuLite.xcodeproj -list

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project XianyuLite.xcodeproj \
            -scheme XianyuLite \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log | tail -80

      - name: Verify .app built
        run: |
          APP=$(find build -name "XianyuLite.app" -maxdepth 6 | head -1)
          if [ -z "$APP" ]; then echo "没找到 .app"; exit 1; fi
          echo "APP=$APP" >> $GITHUB_ENV
          ls -la "$APP"
          echo "--- web 目录 ---"
          ls -la "$APP/web" | head -12
          echo "--- web 文件数 ---"
          find "$APP/web" -type f | wc -l

      - name: Package IPA
        run: |
          set -e
          mkdir -p Payload
          cp -R "$APP" Payload/
          codesign -f -s - --deep "Payload/XianyuLite.app" || true
          zip -qry XianyuLite-unsigned.ipa Payload
          ls -lh XianyuLite-unsigned.ipa
          echo "--- IPA 结构 ---"
          unzip -l XianyuLite-unsigned.ipa | head -8
          unzip -l XianyuLite-unsigned.ipa | tail -3

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XianyuLite-ipa
          path: XianyuLite-unsigned.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore
